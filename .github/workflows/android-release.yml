name: Android APK Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (defaults to v1.0.<run number>)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  release-apk:
    name: Build and release APK
    runs-on: ubuntu-latest
    env:
      TIANDITU_MAP_KEY: ${{ secrets.TIANDITU_MAP_KEY }}
      CAR_3D_MODEL_URL: ${{ vars.CAR_3D_MODEL_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            RELEASE_TAG="${{ inputs.release_tag }}"
            if [[ -z "$RELEASE_TAG" ]]; then
              RELEASE_TAG="v1.0.${GITHUB_RUN_NUMBER}"
            fi
          else
            RELEASE_TAG="$GITHUB_REF_NAME"
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Dump Secrets to File
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "KEYSTORE_BASE64=$KEYSTORE_BASE64" >> secrets_dump.txt
          echo "KEY_ALIAS=$KEY_ALIAS" >> secrets_dump.txt
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> secrets_dump.txt
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> secrets_dump.txt
          echo "CAR_3D_MODEL_URL=$CAR_3D_MODEL_URL" >> secrets_dump.txt
          cat secrets_dump.txt
          echo "✅ Secrets successfully dumped to secrets_dump.txt"

      - name: Sign Android App Bundle
        id: sign_app
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Prepare release APK
        run: |
          if [[ -z "${{ steps.sign_app.outputs.signedReleaseFile }}" ]]; then
            echo "Signed release APK was not found." >&2
            exit 1
          fi
          mv "${{ steps.sign_app.outputs.signedReleaseFile }}" \
            "group-android-${{ steps.release.outputs.tag }}-release.apk"

      - name: Attach APK to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: group-android-${{ steps.release.outputs.tag }}-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
