name: Android APK Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (defaults to v1.0.<run number>)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  release-apk:
    name: Build and release APK
    runs-on: ubuntu-latest
    env:
      TIANDITU_MAP_KEY: ${{ secrets.TIANDITU_MAP_KEY }}
      CAR_3D_MODEL_URL: ${{ vars.CAR_3D_MODEL_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            RELEASE_TAG="${{ inputs.release_tag }}"
            if [[ -z "$RELEASE_TAG" ]]; then
              RELEASE_TAG="v1.0.${GITHUB_RUN_NUMBER}"
            fi
          else
            RELEASE_TAG="$GITHUB_REF_NAME"
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release-keystore.jks
      
      - name: Build and Sign Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
        env:
          KEYSTORE_PATH: "release-keystore.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      
      - name: Clean up Keystore
        if: always()
        run: rm -f app/release-keystore.jks

      - name: Prepare release APK
        run: |
          if [[ -z "${{ steps.sign_app.outputs.signedReleaseFile }}" ]]; then
            echo "Signed release APK was not found." >&2
            exit 1
          fi
          mv "${{ steps.sign_app.outputs.signedReleaseFile }}" \
            "group-android-${{ steps.release.outputs.tag }}-release.apk"

      - name: Attach APK to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: group-android-${{ steps.release.outputs.tag }}-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
